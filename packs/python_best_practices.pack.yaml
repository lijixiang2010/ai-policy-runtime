kind: pack
api_version: policy.skill/v1

pack:
  id: python.best_practices
  name: Python Best Practices
  version: 1.0.0
  description: >-
    Tiered Python policies: compact core rules by default, focused API/testing
    guidance when requested, and heavier product-engineering rules only for
    packaging, security, CLI, concurrency, or performance tasks.

groups:
  core:
    description: Always useful Python defaults with low prompt noise.
    includes:
      - python.core.pythonic_baseline
      - python.style.readability_and_naming
      - python.quality.data_model_and_control_flow
      - python.safety.resources_and_errors
  design:
    description: API, function, class, typing, and test guidance activated by explicit signals.
    includes:
      - python.functions.function_contracts
      - python.classes.classes_protocols
      - python.typing.static_typing
      - python.api_design.interfaces_and_typing
      - python.testing.testing_practices
  professional:
    description: Product-level concerns kept behind precise task context.
    includes:
      - python.packaging.project_packaging
      - python.security.security_boundaries
      - python.cli.cli_applications
      - python.concurrency.async_and_concurrency
      - python.performance.performance_engineering

includes:
  - python.core.pythonic_baseline
  - python.style.readability_and_naming
  - python.functions.function_contracts
  - python.classes.classes_protocols
  - python.typing.static_typing
  - python.quality.data_model_and_control_flow
  - python.safety.resources_and_errors
  - python.api_design.interfaces_and_typing
  - python.packaging.project_packaging
  - python.security.security_boundaries
  - python.cli.cli_applications
  - python.concurrency.async_and_concurrency
  - python.performance.performance_engineering
  - python.testing.testing_practices

excludes: []
overrides: []
