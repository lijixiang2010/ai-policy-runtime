kind: pack
api_version: policy.skill/v1
pack:
  id: cpp.low_latency
  name: C++ Low Latency
  version: 1.0.0
  description: Low-latency C++ policy pack for hot-path systems work.

extends:
  - cpp.safe_generation

includes:
  - cpp.performance.hot_path
  - project.low_latency_trading

excludes: []
overrides:
  - id: prefer_performance_hot_path
    when: hot_path == true
    prefer:
      higher: performance
      lower: readability
    target: decision.optimization
