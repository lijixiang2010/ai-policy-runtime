  - python.classes.classes_protocols
  - python.typing.static_typing
  - python.quality.data_model_and_control_flow
  - python.safety.resources_and_errors
  - python.api_design.interfaces_and_typing
  - python.packaging.project_packaging
  - python.security.security_boundaries
  - python.cli.cli_applications
  - python.concurrency.async_and_concurrency
  - python.performance.performance_engineering
  - python.testing.testing_practices

excludes: []
overrides: []
