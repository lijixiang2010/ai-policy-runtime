cases:
  - id: zh_generic_refinement
    provider: local
    prompt: 帮我把这个模块整理到生产可用，不改变行为，减少意外复杂度，顺便把重复逻辑和接口摩擦处理掉
    include:
      - Preserve the existing observable behavior
      - Remove accidental complexity
      - Extract duplicated logic
      - Avoid extracting code only because it looks similar
      - Minimize the number of steps required
      - Make each component feel complete
      - Verify behavior preservation
    exclude:
      - selected C++ standard
      - Prefer clear call chain
      - Prefer cohesive component
      - Use language-native constructs
    max_soft_rules: 9
    max_preferences: 4

  - id: en_component_grouping
    provider: deterministic
    prompt: Refactor these scattered helpers and state into a cohesive component without changing behavior.
    include:
      - Preserve the existing observable behavior
      - Group related variables, functions, helpers, and state
      - Group related state, helper functions, and behavior
    exclude:
      - selected C++ standard
      - Extract duplicated logic
      - Minimize the number of steps required
    max_soft_rules: 9
    max_preferences: 4

  - id: zh_api_usability
    provider: deterministic
    prompt: 这个接口调用步骤太多，帮我降低调用方负担，给常见路径合理默认值
    include:
      - Minimize the number of steps required
      - Provide reasonable defaults
      - Prefer simple common case usage
      - Verify the resulting API requires fewer or clearer user steps
    exclude:
      - selected C++ standard
      - Extract duplicated logic
      - Prefer clear call chain
    max_soft_rules: 9
    max_preferences: 4

  - id: zh_hierarchy_cleanup
    provider: deterministic
    prompt: 这几个模块调用链太绕，还有循环依赖风险，帮我整理层次但不要改变行为
    include:
      - Preserve the existing observable behavior
      - Clarify component hierarchy
      - Keep dependency direction stable
      - Avoid introducing circular dependencies
    exclude:
      - selected C++ standard
      - Minimize the number of steps required
      - Extract duplicated logic
      - Extract shared control flow
      - Prefer explicit variation point
    max_soft_rules: 9
    max_preferences: 4

  - id: en_parameterized_variation
    provider: deterministic
    prompt: These implementations share the same control flow with small variations; extract the shared structure carefully.
    include:
      - Extract shared control flow
      - Give variation points clear names
      - Avoid replacing clear specialized logic with a parameterized abstraction
      - Prefer explicit variation point
    exclude:
      - selected C++ standard
      - Minimize the number of steps required
    max_soft_rules: 9
    max_preferences: 4

  - id: zh_daily_make_code_better
    provider: deterministic
    prompt: 这段代码现在能跑，但有点乱，帮我整理清楚一点，行为不要变
    include:
      - Preserve the existing observable behavior
      - Remove accidental complexity
      - Make each component feel complete
      - Verify behavior preservation
    exclude:
      - selected C++ standard
      - Minimize the number of steps required
      - Extract shared control flow
      - Extract duplicated logic
    max_soft_rules: 9
    max_preferences: 4

  - id: en_cpp_review_lifetime
    provider: deterministic
    prompt: Review this C++20 header for ownership, lifetime, and undefined behavior risks.
    include:
      - Avoid undefined behavior
      - Preserve ownership and lifetime safety
      - Verify recommendations use facilities available in the selected C++ standard
    exclude:
      - Prefer simple common case usage
      - Minimize the number of steps required

  - id: en_cpp23_api
    provider: deterministic
    prompt: Design a C++23 parser API that returns errors explicitly and avoids hidden ownership transfer.
    include:
      - Do not use facilities unavailable in the selected C++ standard
      - Make resource ownership explicit
      - Prefer available standard facility
    exclude:
      - Prefer simple common case usage

  - id: en_git_commit_message
    provider: deterministic
    prompt: Prepare a git commit message for the staged diff and split unrelated changes.
    include:
      - Make the commit message accurately describe the changes being committed
      - Keep each commit focused on one coherent reason for change
      - Review the staged diff before committing
      - Do not discard, overwrite, reset, clean
    exclude:
      - selected C++ standard
      - Preserve the existing observable behavior

  - id: en_git_history_rewrite
    provider: deterministic
    prompt: I need to squash these git commits with interactive rebase and force push safely.
    include:
      - Do not rebase, amend, reset, or force-push commits
      - Use force-with-lease rather than an unconditional force push
      - Use amend, squash, fixup, and interactive rebase primarily for local
    exclude:
      - selected C++ standard

  - id: en_git_conflict_pr
    provider: deterministic
    prompt: Resolve this git merge conflict and prepare the branch for PR review.
    include:
      - Resolve conflict markers by understanding both sides
      - Inspect ours, theirs, and the surrounding code
      - summarize the branch purpose
      - Avoid resolving conflicts by blindly choosing ours or theirs
    exclude:
      - selected C++ standard

  - id: en_git_stash_clean
    provider: deterministic
    prompt: Stash my unfinished work, then clean untracked generated files safely.
    include:
      - Run or recommend a dry-run clean before deleting
      - Do not clean ignored files
      - Use stash for unfinished work
      - Decide explicitly whether untracked files belong in the stash
    exclude:
      - selected C++ standard
      - Make the commit message accurately describe

  - id: en_git_pr_readiness
    provider: deterministic
    prompt: Prepare this git branch for a pull request with a conventional PR title.
    include:
      - Check that the branch contains only relevant commits
      - Make the pull request title follow
      - Keep pull request diffs focused
      - Use short branch names
    exclude:
      - selected C++ standard

  - id: en_cmake_target_usage
    provider: deterministic
    prompt: Modernize this CMakeLists.txt to use target-based CMake with correct PUBLIC PRIVATE INTERFACE usage.
    include:
      - Express include directories, compile definitions
      - Use PRIVATE for implementation-only requirements
      - Provide namespaced aliases
      - Avoid changing global variables
    exclude:
      - selected C++ standard
      - force-with-lease

  - id: en_cmake_dependency
    provider: deterministic
    prompt: Add a third party dependency with find_package or FetchContent and keep the build reproducible.
    include:
      - Prefer dependency consumption through imported targets
      - Use find_package with config packages
      - Pin FetchContent or ExternalProject dependencies
    exclude:
      - selected C++ standard
      - pull request

  - id: zh_cmake_presets_tests
    provider: local
    prompt: 给这个 CMake 项目加预设和 CTest 测试，把 sanitizer 做成可选质量检查
    include:
      - Keep generated build files outside the source tree
      - Put stable project configure, build, test, package
      - Add tests through CTest-compatible entrypoints
      - Keep sanitizers, coverage, static analysis
    exclude:
      - selected C++ standard
      - Do not rebase

  - id: en_cmake_flags_and_glob
    provider: deterministic
    prompt: Replace CMAKE_CXX_FLAGS and file(GLOB) with target_compile_features and explicit target_sources.
    include:
      - Prefer target_compile_features
      - Prefer explicit target_sources entries
      - Use generator expressions
      - broad file globbing
    exclude:
      - selected C++ standard
      - force-with-lease

  - id: en_non_code_copy
    provider: deterministic
    prompt: Improve this landing page copy for launch, no code changes.
    applicable: false

  - id: zh_explain_code_only
    provider: deterministic
    prompt: 只解释这段代码在做什么，不需要修改
    applicable: false

  - id: zh_error_log_summary
    provider: deterministic
    prompt: 帮我把这段报错日志总结成 issue 描述，先不要修改代码
    applicable: false

  - id: zh_cpp_low_latency_queue
    provider: deterministic
    prompt: 写一个 C++20 数据通道，主循环里不能有分配和阻塞，尾延迟要稳
    include:
      - Avoid undefined behavior
      - Do not use facilities unavailable in the selected C++ standard
      - Verify recommendations use facilities available in the selected C++ standard
    exclude:
      - Prefer simple common case usage
