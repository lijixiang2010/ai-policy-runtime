source_notes:
  - Gist guidance, PEP references, and local book topic outlines were compressed
    into project-owned AI execution rules.

rules:
  hard:
    - id: python.core.preserve_behavior
      title: Preserve observable behavior during Python refinement
      when: language == "python" and refinement_requested == true
      must: >-
        Preserve the existing observable behavior unless the task explicitly asks
        for a behavior change.
      target: behavior_preservation
      action: require
      rationale: Refactoring and best-practice cleanup must not silently change semantics.

    - id: python.core.do_not_disable_validation
      title: Do not hide validation failures
      when: language == "python"
      must_not: >-
        Do not disable, delete, skip, xfail, or weaken tests, lint rules, type
        checks, or validation gates merely to make a Python change appear to pass.
      target: validation_integrity
      action: forbid
      rationale: Product-quality changes preserve the signal from validation.

  soft:
    - id: python.core.prefer_explicit_readable_code
      title: Prefer explicit readable Python
      when: language == "python"
      should: >-
        Prefer explicit, readable Python that makes control flow, data flow, and
        important assumptions easy to see.
      target: readability
      action: recommend
      rationale: Python code is usually read more often than it is written.

    - id: python.core.use_language_native_idioms
      title: Use Python-native constructs
      when: language == "python"
      should: >-
        Use Python-native constructs such as iteration, unpacking, context
        managers, comprehensions, generators, and standard-library helpers when
        they express the operation directly.
      target: pythonic_idioms
      action: recommend
      rationale: Idiomatic Python reduces incidental code while keeping intent visible.

    - id: python.core.inspect_project_conventions
      title: Inspect project conventions before changing Python code
      when: language == "python"
      should: >-
        Inspect the existing Python version, package layout, dependency manager,
        formatter, linter, type checker, test runner, and nearby code style before
        making non-trivial edits.
      target: project_conventions
      action: recommend
      rationale: Python projects vary widely; product-level changes should align with the repo.

    - id: python.core.prefer_standard_library_first
      title: Prefer the standard library first
      when: language == "python"
      should: >-
        Prefer standard-library modules and existing project dependencies before
        adding new runtime dependencies.
      target: dependencies
      action: recommend
      rationale: Avoiding unnecessary dependencies improves portability and maintenance.

    - id: python.core.keep_import_time_light
      title: Keep import-time behavior light
      when: language == "python"
      should: >-
        Keep module import time free of expensive I/O, network calls, subprocess
        launches, environment mutation, and application execution; put executable
        work behind functions, entry points, or main guards.
      target: import_time_behavior
      action: recommend
      rationale: Import-safe modules are easier to test, reuse, and package.

    - id: python.core.avoid_clever_density
      title: Avoid clever or overly dense Python
      when: language == "python"
      should_not: >-
        Do not compress logic into clever one-liners, nested expressions, or
        advanced language features when simpler statements would be clearer.
      target: readability
      action: discourage
      rationale: Pythonic code values clarity over compactness.

    - id: python.core.validate_appropriate_level
      title: Validate at the appropriate level
      when: language == "python"
      should: >-
        Run or recommend the project-native validation appropriate to the change,
        such as affected tests for local logic, full tests and type checks for
        public API changes, build or install smoke tests for packaging, and
        targeted stress, benchmark, or security tests for high-risk changes.
      target: validation
      action: recommend
      rationale: Validation should scale with the risk and blast radius of the change.

  preference:
    - id: python.core.preference_readability_over_cleverness
      title: Prefer readability over cleverness
      when: language == "python"
      prefer: readability
      over:
        - cleverness
      target: implementation_style
      action: prefer

verification:
  llm_self_check:
    - id: python.core.verify_readability
      type: llm_self_check
      applies_to:
        - readability
        - pythonic_idioms
      severity: advisory
      prompt: >-
        Check that the Python code is explicit, readable, idiomatic, and does not
        hide important behavior in clever expressions. Also check that existing
        project tooling was respected and validation results were reported honestly.
