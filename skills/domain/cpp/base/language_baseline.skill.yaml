# Skill: C++ Core Baseline
# File: skills/domain/cpp/base/language_baseline.skill.yaml

skill:
  id: cpp.core.baseline
  name: C++ Core Baseline
  version: 1.0.0
  status: stable
  description: Minimal baseline activation policy for modern C++ tasks.

  level: domain
  domain: cpp
  category: base
  priority: 60

  tags:
    - cpp
    - baseline
    - modern-cpp

  capabilities:
    - code_generation
    - code_review
    - refactor_code

  activation:
    when:
      language: cpp
      standard: '>=17'
    triggers:
      - write_code
      - review_code
      - refactor_code

  dependencies: []

  incompatibilities: []

task_analysis:
  domain_aliases:
    - c++
    - cpp
    - cxx

  domain_semantics:
    - C++ source or header task
    - modern C++ systems programming task

  trigger_aliases:
    write_code:
      - write
      - implement
      - generate
      - 写
    review_code:
      - review
      - inspect
    refactor_code:
      - refactor

  trigger_semantics:
    write_code:
      - write C++ code
      - implement a C++ component
      - generate source code for a data structure or data channel
      - write latency-sensitive C++ implementation code
    review_code:
      - review C++ code
    refactor_code:
      - refactor C++ code

  trigger_capabilities:
    write_code:
      - code_generation
    review_code:
      - code_review
    refactor_code:
      - refactor_code

  context_rules:
    - id: detect_modern_cpp_baseline
      when_text_matches:
        - modern c++
        - c++
        - cpp
      set:
        language: cpp
      tags:
        - cpp
      confidence: 0.62

rules:
  hard:
    - id: cpp.core.require_modern_cpp_context
      title: Use the selected modern C++ context
      when: language == "cpp"
      must: >-
        Use the selected modern C++ standard and project context when generating
        or modifying C++ code.
      target: standard_availability
      action: require
      rationale: Use modern C++ conventions for C++17 and later tasks.

  soft:
    - id: cpp.core.prefer_standard_library
      title: Prefer standard library facilities first
      when: language == "cpp"
      should: >-
        Prefer standard-library facilities before custom utilities unless task
        context requires otherwise.
      target: standard_availability
      action: recommend
      rationale: >-
        Prefer the standard library before custom utilities unless task context
        requires otherwise.

  preference:
    - id: cpp.core.preference.clarity_over_cleverness
      title: Prefer clarity over cleverness
      when: language == "cpp"
      prefer: clarity
      over:
        - cleverness
      target: source_structure
      action: prefer

authoring_notes:
  - Keep this baseline small; put safety, standard-version, and source-structure
    policy in dedicated C++ skills.
