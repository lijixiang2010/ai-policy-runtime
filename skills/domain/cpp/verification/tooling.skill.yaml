# Skill: C++ Verification Tooling
# File: skills/domain/cpp/verification/tooling.skill.yaml

skill:
  id: cpp.verification.tooling
  name: C++ Verification Tooling
  version: 1.0.0
  status: stable
  description: >-
    Verification skill for C++ tests, warnings, static analysis, sanitizers,
    fuzzing, CI matrices, multiple compilers, and build/package tooling.

  level: domain
  domain: cpp
  category: verification
  priority: 74

  tags:
    - cpp
    - verification
    - testing
    - tooling
    - ci

  capabilities:
    - code_review
    - refactor_code
    - code_generation
    - modernization

  activation:
    when:
      language: cpp
    triggers:
      - write_code
      - review_code
      - refactor_code
      - modernize_code
      - design_api

  dependencies:
    - cpp.standard.standard_availability

  incompatibilities: []

sources:
  - jason_turner_cpp23_best_practices:14
  - jason_turner_cpp23_best_practices:15
  - jason_turner_cpp23_best_practices:16
  - jason_turner_cpp23_best_practices:17
  - jason_turner_cpp23_best_practices:18
