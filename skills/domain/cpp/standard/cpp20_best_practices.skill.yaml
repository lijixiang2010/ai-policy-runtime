# Skill: C++20 Best Practices
# File: skills/domain/cpp/standard/cpp20_best_practices.skill.yaml

skill:
  id: cpp.standard.cpp20.best_practices
  name: C++20 Best Practices
  version: 1.0.0
  status: stable
  description: >-
    C++20 idiom skill for span, concepts, jthread, string prefix checks, and constexpr-capable
    facilities.

  level: domain
  domain: cpp
  category: standard
  priority: 86

  tags:
    - cpp
    - cpp20
    - modernization
    - standard-library
    - api-design
    - templates

  capabilities:
    - code_generation
    - code_review
    - refactor_code
    - api_design
    - modernization

  activation:
    when:
      language: cpp
      standard: '>=20'
    triggers:
      - write_code
      - review_code
      - refactor_code
      - design_api
      - modernize_code

  dependencies:
    - cpp.standard.cpp17.best_practices
    - cpp.standard.standard_availability

  incompatibilities: []

task_analysis:
  context_rules:
    - id: detect_cpp20_standard
      when_text_matches:
        - c++20
        - cpp20
        - cxx20
      set:
        standard: 20
        selected_standard_is_known: true
      tags:
        - cpp20
      confidence: 0.95

    - id: detect_cpp20_contiguous_range_parameter
      when_text_matches:
        - span
        - std::span
        - contiguous range
        - range parameter
        - buffer view
      set:
        designing_api: true
        parameter_kind: contiguous_range
        ownership_required: false
      tags:
        - api-design
      semantic_match:
        - accepts a non-owning contiguous range
        - API takes a buffer view without ownership transfer
      confidence: 0.84

sources:
  - cpp_core_guidelines:F.24
  - cpp_core_guidelines:T.10
  - cpp_core_guidelines:CP.25
  - cpp_core_guidelines:Per.11

source_notes:
  - Source references are for traceability only; rules are reconstructed into
    project-owned C++ Skill guidance.

rules:
  soft:
    - id: cpp20.prefer_span_for_contiguous_ranges
      title: Prefer std::span for non-owning contiguous range parameters
      when: language == "cpp" and standard >= 20 and parameter_kind == "contiguous_range"
        and ownership_required == false
      should: >-
        Treat std::span as the C++20 standard vocabulary type for non-owning
        contiguous range input.
      target: contiguous_range_parameter
      action: recommend
      unless: abi_boundary == true or c_api_boundary == true or legacy_interface_required
        == true
      require:
        - If pointer plus size is used, justify ABI, C API, legacy, or measured
          performance constraints.
      rationale: >-
        std::span is for non-owning contiguous ranges, not a replacement for string-like
        parameters.

    - id: cpp20.prefer_concepts_for_template_constraints
      title: Prefer concepts over SFINAE or std::enable_if for template constraints
      when: language == "cpp" and standard >= 20 and template_constraints_required
        == true
      should: >-
        Prefer C++20 concepts and requires-clauses when template constraints are
        part of the interface.
      target: template_constraints
      action: recommend
      rationale: >-
        Concepts express interface requirements and improve diagnostics.

    - id: cpp20.prefer_jthread_for_owned_threads
      title: Prefer std::jthread for owned thread lifetime
      when: language == "cpp" and standard >= 20 and creates_owned_thread == true
      should: >-
        Treat std::jthread as the C++20 standard thread owner when scoped
        joining or cooperative cancellation is useful.
      target: thread_lifetime
      action: recommend
      rationale: >-
        jthread joins on destruction and supports cooperative cancellation.

    - id: cpp20.prefer_starts_ends_with
      title: Prefer starts_with and ends_with for prefix or suffix checks
      when: language == "cpp" and standard >= 20 and operation == "string_prefix_or_suffix_check"
      should: >-
        Prefer starts_with and ends_with for prefix or suffix checks in C++20
        and later.
      target: standard_availability
      action: recommend
      rationale: >-
        Named operations express string intent better than manual substring comparisons.

    - id: cpp20.prefer_constexpr_capable_facilities
      title: Prefer C++20 constexpr-capable facilities when compile-time evaluation
        is intended
      when: language == "cpp" and standard >= 20 and compile_time_evaluation_intended
        == true
      should: >-
        Prefer C++20 constexpr-capable standard facilities when compile-time evaluation
        is intended.
      target: standard_availability
      action: recommend
      rationale: >-
        C++20 makes more standard facilities usable in constant evaluation.

  preference:
    - id: cpp20.preference_precise_modern_facility
      title: Prefer the most precise C++20 facility available
      when: language == "cpp" and standard >= 20
      prefer: precise_cxx20_facility
      over:
        - legacy_idiom
      target: standard_availability
      action: prefer

exceptions:
  - id: cpp20.exception_compatibility_boundary
    when: abi_boundary == true or c_api_boundary == true or legacy_interface_required
      == true
    allow:
      - legacy_idiom
    require:
      - Explain the compatibility constraint.
      - Keep modern internal representation where practical.

verification:
  llm_self_check:
    - id: cpp.standard.cpp20.best_practices.verify.standard_version_idiom_review
      type: llm_self_check
      applies_to:
        - contiguous_range_parameter
        - standard_availability
        - template_constraints
      severity: advisory
      prompt: Review standard-version idiom review for this skill.

    - id: cpp.standard.cpp20.best_practices.verify.exception_justification_review
      type: llm_self_check
      applies_to:
        - contiguous_range_parameter
        - standard_availability
        - template_constraints
      severity: advisory
      prompt: Review exception justification review for this skill.

effective_rule_examples:
  cpp20_span_task:
    task_context:
      language: cpp
      standard: 20
      parameter_kind: contiguous_range
    effective_rules:
      soft:
        - Prefer std::span for non-owning contiguous range parameters.

authoring_notes:
  - C++20 rules may add precision but should not erase compatible C++17 recommendations.
