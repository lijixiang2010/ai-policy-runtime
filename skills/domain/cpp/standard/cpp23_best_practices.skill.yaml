# Skill: C++23 Best Practices
# File: skills/domain/cpp/standard/cpp23_best_practices.skill.yaml

skill:
  id: cpp.standard.cpp23.best_practices
  name: C++23 Best Practices
  version: 1.0.0
  status: stable
  description: >-
    C++23 idiom skill for standard library modules, print facilities, C++23
    range views, bind_back, unreachable, and expanded constexpr use.

  level: domain
  domain: cpp
  category: standard
  priority: 88

  tags:
    - cpp
    - cpp23
    - modernization
    - standard-library
    - modules
    - ranges

  capabilities:
    - code_generation
    - code_review
    - refactor_code
    - api_design
    - modernization

  activation:
    when:
      language: cpp
      standard: '>=23'
    triggers:
      - write_code
      - review_code
      - refactor_code
      - design_api
      - modernize_code

  dependencies:
    - cpp.standard.cpp20.best_practices
    - cpp.standard.standard_availability
    - cpp.source_structure.source_file_organization
    - cpp.safety.undefined_behavior

  incompatibilities: []

task_analysis:
  context_rules:
    - id: detect_cpp23_standard
      when_text_matches:
        - c++23
        - cpp23
        - cxx23
      set:
        standard: 23
        selected_standard_is_known: true
      tags:
        - cpp23
      confidence: 0.95

    - id: detect_cpp23_modules_task
      when_text_matches:
        - import std
        - standard library module
        - module interface
        - exported overload
      set:
        source_structure: true
        module_interface: true
      tags:
        - modules
        - source_structure
      semantic_match:
        - use C++23 standard library modules
        - design a module interface
        - review exported overload consistency
      confidence: 0.84

    - id: detect_cpp23_print_task
      when_text_matches:
        - std::print
        - std::println
        - <print>
        - iostream
        - printf
      set:
        formatting_output: true
      tags:
        - standard-library
      semantic_match:
        - modernize formatted output in C++23
        - replace printf or iostream formatting
      confidence: 0.78

    - id: detect_cpp23_range_views_task
      when_text_matches:
        - zip_view
        - enumerate
        - chunk_view
        - slide_view
        - adjacent_view
        - stride_view
        - ranges
      set:
        range_operation: true
      tags:
        - ranges
        - standard-library
      semantic_match:
        - use C++23 range views to express range logic
      confidence: 0.78

    - id: detect_cpp23_callable_binding_task
      when_text_matches:
        - bind_back
        - std::bind
        - std::function
        - callable binding
      set:
        callable_binding_required: true
      tags:
        - standard-library
      semantic_match:
        - bind trailing arguments for a callable
      confidence: 0.74

