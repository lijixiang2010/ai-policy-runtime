# Skill: C++17 Best Practices
# File: skills/domain/cpp/standard/cpp17_best_practices.skill.yaml

skill:
  id: cpp.standard.cpp17.best_practices
  name: C++17 Best Practices
  version: 1.0.0
  status: stable
  description: >-
    C++17 idiom skill for vocabulary types, filesystem, optional values, closed
    alternatives, and scoped control flow.

  level: domain
  domain: cpp
  category: standard
  priority: 80

  tags:
    - cpp
    - cpp17
    - modernization
    - standard-library
    - api-design

  capabilities:
    - code_generation
    - code_review
    - refactor_code
    - api_design
    - modernization

  activation:
    when:
      language: cpp
      standard: '>=17'
    triggers:
      - write_code
      - review_code
      - refactor_code
      - design_api
      - modernize_code

  dependencies:
    - cpp.standard.standard_availability

  incompatibilities: []

task_analysis:
  trigger_aliases:
    design_api:
      - api
      - design api
      - interface
    modernize_code:
      - modernize

  trigger_semantics:
    design_api:
      - design a public C++ API
      - choose parameter types for a function signature
    modernize_code:
      - modernize C++ code to standard library vocabulary types

  trigger_capabilities:
    design_api:
      - api_design
      - code_generation
    modernize_code:
      - modernization
      - refactor_code
      - code_generation

  context_rules:
    - id: detect_cpp17_standard
      when_text_matches:
        - c++17
        - cpp17
        - cxx17
      set:
        standard: 17
        selected_standard_is_known: true
      tags:
        - cpp17
      semantic_match:
        - compile or design this C++ code for the C++17 standard
        - use C++17 library facilities and avoid newer standard requirements
      confidence: 0.95

    - id: detect_cpp17_read_only_string_parameter
      when_text_matches:
        - read-only string
        - string parameter
        - string input
      set:
        designing_api: true
        parameter_kind: read_only_string
        ownership_required: false
      tags:
        - api-design
      semantic_match:
        - function accepts a read-only string-like parameter
        - choose string_view or string parameter for a C++ API
      confidence: 0.84

sources:
  - cpp_core_guidelines:F.16
  - cpp_core_guidelines:F.21
  - cpp_core_guidelines:SL.str.2
  - cpp_core_guidelines:Enum.5

source_notes:
  - Source references are for traceability only; rules are reconstructed into
    project-owned C++ Skill guidance.

rules:
  soft:
    - id: cpp17.prefer_string_view_for_read_only_string_parameters
      title: Prefer std::string_view for read-only string parameters
      when: language == "cpp" and standard >= 17 and parameter_kind == "read_only_string"
        and ownership_required == false
      should: >-
        Treat std::string_view as the C++17 standard vocabulary type for
        non-owning read-only string-like input.
      target: string_parameter
      action: recommend
      unless: abi_boundary == true or c_api_boundary == true or null_terminated_required
        == true or legacy_interface_required == true
      require:
        - If const char* is used, justify null-termination, ABI, C API, or legacy
          requirements.
      rationale: >-
        std::string_view represents non-owning string-like input; it is not a
        general range type.

    - id: cpp17.prefer_optional_for_normal_absence
      title: Prefer std::optional for normal absence
      when: language == "cpp" and standard >= 17 and value_may_be_absent == true
        and absence_is_not_error == true
      should: >-
        Prefer std::optional for normal absence when absence is not an error.
      target: api_design
      action: recommend
      rationale: >-
        optional makes normal absence explicit without sentinel values.

    - id: cpp17.prefer_variant_for_closed_alternatives
      title: Prefer std::variant for closed alternatives
      when: language == "cpp" and standard >= 17 and alternatives_are_closed ==
        true
      should: >-
        Prefer std::variant for closed alternatives that are known at compile
        time.
      target: type_safety
      action: recommend
      rationale: >-
        variant models closed alternatives without open inheritance or manual
        tags.

    - id: cpp17.prefer_filesystem_for_paths
      title: Prefer std::filesystem for path operations
      when: language == "cpp" and standard >= 17 and operation_involves_filesystem_path
        == true
      should: >-
        Prefer std::filesystem for portable path operations in C++17 and later.
      target: standard_availability
      action: recommend
      rationale: >-
        filesystem provides portable path vocabulary and operations.

    - id: cpp17.prefer_if_switch_initializer
      title: Prefer if/switch initializer for limited-scope temporaries
      when: language == "cpp" and standard >= 17 and temporary_needed_only_for_condition
        == true
      should: >-
        Prefer if or switch initializers for temporaries whose lifetime should
        be limited to the condition.
      target: source_structure
      action: recommend
      rationale: Initializers reduce variable scope and clarify lifetime.

  preference:
    - id: cpp17.preference_modern_vocabulary_types
      title: Prefer C++17 vocabulary types over ad-hoc conventions
      when: language == "cpp" and standard >= 17
      prefer: cxx17_vocabulary_type
      over:
        - ad_hoc_convention
      target: api_design
      action: prefer

exceptions:
  - id: cpp17.exception_abi_or_legacy_interface
    when: abi_boundary == true or c_api_boundary == true or legacy_interface_required
      == true
    allow:
      - legacy_parameter_type
    require:
      - Explain the boundary or compatibility requirement.
      - Convert to modern vocabulary types internally when practical.

verification:
  llm_self_check:
    - id: cpp.standard.cpp17.best_practices.verify.standard_version_idiom_review
      type: llm_self_check
      applies_to:
        - api_design
        - source_structure
        - standard_availability
      severity: advisory
      prompt: Review standard-version idiom review for this skill.

    - id: cpp.standard.cpp17.best_practices.verify.interface_intent_review
      type: llm_self_check
      applies_to:
        - api_design
        - source_structure
        - standard_availability
      severity: advisory
      prompt: Review interface intent review for this skill.

effective_rule_examples:
  cpp17_string_view_task:
    task_context:
      language: cpp
      standard: 17
      parameter_kind: read_only_string
    effective_rules:
      soft:
        - Prefer std::string_view for read-only string-like input.

authoring_notes:
  - Do not recommend std::span for string-like input; std::string_view carries
    string intent.
