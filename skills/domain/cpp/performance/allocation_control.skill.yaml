# Skill: C++ Allocation Control
# File: skills/domain/cpp/performance/allocation_control.skill.yaml

skill:
  id: cpp.performance.allocation_control
  name: C++ Allocation Control
  version: 1.0.0
  status: stable
  description: >-
    Allocation policy for avoiding unnecessary dynamic allocation and using capacity
    planning where appropriate.

  level: domain
  domain: cpp
  category: performance
  priority: 72

  tags:
    - cpp
    - performance
    - allocation

  capabilities:
    - code_generation
    - code_review
    - refactor_code

  activation:
    when: >
      language == "cpp" and
      (allocation_sensitive == true or hot_path == true or performance_critical == true)
    triggers:
      - write_code
      - review_code
      - refactor_code

  dependencies:
    - cpp.resource_management.raii

  incompatibilities: []

task_analysis:
  context_rules:
    - id: detect_allocation_sensitive_task
      when_text_matches:
        - allocation
        - reserve
        - heap
        - dynamic allocation
        - pmr
        - allocator
        - container
        - 分配
        - 堆分配
      set:
        allocation_sensitive: true
      tags:
        - performance
      confidence: 0.76

sources:
  - cpp_core_guidelines:Per.14
  - cpp_core_guidelines:Per.15
  - cpp_core_guidelines:SL.con.2
  - jason_turner_cpp23_best_practices:32
  - jason_turner_cpp23_best_practices:34
  - jason_turner_cpp23_best_practices:35
  - jason_turner_cpp23_best_practices:59
  - jason_turner_cpp23_best_practices:60

source_notes:
  - Source references are for traceability only; rules are reconstructed into
    project-owned C++ Skill guidance.

rules:
  soft:
    - id: cpp.alloc.avoid_unnecessary_dynamic_allocation
      title: Avoid unnecessary dynamic allocation
      when: >
        language == "cpp" and
        (allocation_sensitive == true or hot_path == true or performance_critical == true)
      should_not: >-
        Avoid unnecessary dynamic allocation and make any required allocation
        policy explicit in allocation-sensitive code.
      target: allocation
      action: discourage
      rationale: >-
        Allocation adds cost, failure paths, and sometimes latency variance.
      unless: custom_allocator_required == true
      require:
        - If custom allocation is used, explain the ownership, lifetime, and performance
          reason.
        - Keep allocator-specific code localized behind a clear abstraction.

    - id: cpp.alloc.prefer_automatic_storage_when_lifetime_is_local
      title: Prefer automatic storage when lifetime is local
      when: >
        language == "cpp" and
        (allocation_sensitive == true or hot_path == true or performance_critical == true)
      should: >-
        Prefer automatic storage for local objects when lifetime and size make
        it appropriate.
      target: allocation
      action: recommend
      rationale: >-
        Local automatic objects simplify ownership and give optimizers more
        opportunity to remove unnecessary storage.

    - id: cpp.alloc.reserve_when_size_known
      title: Reserve capacity when size is known
      when: language == "cpp" and expected_size_known == true
      should: >-
        Reserve capacity when the required size is known or can be cheaply estimated.
      target: allocation
      action: recommend
      rationale: Reserving can avoid repeated reallocations.

    - id: cpp.alloc.prefer_array_or_vector_for_locality
      title: Prefer array or vector for contiguous storage
      when: >
        language == "cpp" and
        (allocation_sensitive == true or hot_path == true or performance_critical == true)
      should: >-
        Prefer std::array for fixed-size data and std::vector for dynamic
        contiguous data when their semantics fit.
      target: allocation
      action: recommend
      rationale: >-
        Contiguous storage is cache-friendly, optimizer-friendly, and easier to
        reason about than node-based storage in many hot or allocation-sensitive
        paths.

    - id: cpp.alloc.localize_custom_allocation_strategy
      title: Localize custom allocation strategies
      when: language == "cpp" and custom_allocator_required == true
      should: >-
        Keep PMR or custom allocator usage localized behind a clear ownership
        and lifetime boundary.
      target: allocation
      action: recommend
      rationale: >-
        Custom allocation can be valuable in hotspots, but spreading allocation
        policy through ordinary code increases coupling and lifetime risk.

    - id: cpp.alloc.avoid_initializer_list_for_non_trivial_hot_data
      title: Avoid initializer_list for non-trivial allocation-sensitive data
      when: >
        language == "cpp" and
        (allocation_sensitive == true or hot_path == true or performance_critical == true)
      should_not: >-
        Avoid std::initializer_list construction for non-trivial or move-only
        element types when copies, moves, or allocations matter.
      target: allocation
      action: discourage
      rationale: >-
        initializer_list elements are const, which can force copies or prevent
        moving for non-trivial element types.

    - id: cpp.alloc.avoid_unnecessary_type_erasure_in_hot_paths
      title: Avoid unnecessary type erasure in hot paths
      when: language == "cpp" and hot_path == true
      should_not: >-
        Avoid unnecessary std::function or similar type-erased call wrappers in
        hot paths unless their allocation and dispatch costs are acceptable.
      target: hot_path
      action: discourage
      rationale: >-
        Type erasure can add indirect calls, larger objects, and possible dynamic
        allocation in latency-sensitive code.

    - id: cpp.alloc.avoid_premature_optimization
      title: Avoid premature optimization outside hot paths
      when: language == "cpp" and allocation_sensitive == true and hot_path != true
      should_not: >-
        Avoid allocation-focused micro-optimizations outside hot paths unless
        there is evidence of value.
      target: allocation
      action: discourage
      rationale: >-
        Allocation changes should preserve clarity unless there is a performance
        reason.

  preference:
    - id: cpp.alloc.preference_clarity_outside_hot_path
      title: Prefer clarity outside hot paths
      when: language == "cpp" and allocation_sensitive == true and hot_path != true
      prefer: maintainability
      over:
        - micro_optimization
      target: allocation
      action: prefer

exceptions:
  - id: cpp.alloc.exception_allocator_policy
    when: custom_allocator_required == true
    allow:
      - custom_allocation_strategy
    require:
      - Explain allocator ownership and lifetime.
      - Keep allocation policy visible.

verification:
  static_checks:
    - id: cpp.performance.allocation_control.verify.performance_unnecessary_copy_initialization
      type: static_analysis
      applies_to:
        - allocation
      severity: warning
      check: performance-unnecessary-copy-initialization

  llm_self_check:
    - id: cpp.performance.allocation_control.verify.allocation_review
      type: llm_self_check
      applies_to:
        - allocation
      severity: advisory
      prompt: >-
        Review whether allocation choices are justified by task context and measured
        needs.

effective_rule_examples:
  hot_path_alloc:
    task_context:
      language: cpp
      hot_path: true
    effective_rules:
      soft:
        - Avoid unnecessary dynamic allocation.
        - Prefer std::array for fixed-size data and std::vector for dynamic
          contiguous data when their semantics fit.

authoring_notes:
  - Allocation guidance should be stricter in hot paths and more conservative
    elsewhere.
