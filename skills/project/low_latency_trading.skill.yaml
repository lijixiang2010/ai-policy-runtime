skill:
  id: project.low_latency_trading
  name: Low Latency Trading Project Policy
  version: 1.0.0
  status: stable

  description: >
    Project-level policy for low-latency matching and trading systems.

  level: project
  domain: cpp
  category: low_latency_trading
  priority: 90
  owner: project-policy

  tags:
    - cpp
    - low-latency
    - trading

  capabilities:
    - code_generation
    - code_review
    - refactor_code

  activation:
    when:
      language: cpp
      hot_path: true

    triggers:
      - write_code
      - review_code
      - refactor_code

task_analysis:
  context_rules:
    - field: context.scenario
      value: matching_engine
      match:
        - matching
        - match engine
      set:
        scenario: matching_engine
        performance_critical: true
        hot_path: true
      tags:
        - systems_programming
        - trading
      semantic_match:
        - low latency matching engine
        - order matching engine
        - trading engine matching loop
        - exchange core matching path
      confidence: 0.86

    - field: context.scenario
      value: low_latency_queue
      match:
        - low latency queue
        - low-latency queue
      set:
        scenario: low_latency_queue
        data_structure: queue
        performance_critical: true
        hot_path: true
      tags:
        - data_structure
        - low_latency
      semantic_match:
        - low latency queue
        - low latency queue implementation
        - latency-sensitive producer consumer queue
        - queue for passing events in a trading hot path
        - data channel with strict tail latency requirements
      confidence: 0.84

  dependencies:
    - cpp.safety.undefined_behavior
    - cpp.safety.ownership
    - cpp.performance.hot_path

  incompatibilities: []

rules:
  hard: []
  soft:
    - id: document_latency_tradeoffs
      when: hot_path == true
      should: latency_tradeoff_justification
      target: documentation.latency
      reason: Explain meaningful latency tradeoffs in performance-critical code.
  preference:
    - id: prefer_predictability
      when: hot_path == true
      prefer:
        higher: predictable_latency
        lower: average_throughput
      target: decision.performance_model

exceptions: []
verification: []
